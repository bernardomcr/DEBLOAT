name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Testes
        run: dotnet test Debloat.slnx --configuration Release
      - name: Publicar o programa
        run: dotnet publish src/Debloat.App/Debloat.App.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v5
        with:
          name: DEBLOAT
          path: publish/DEBLOAT.exe
