name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # a tag v* cria a release com o .exe
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Testes
        run: dotnet test Debloat.slnx --configuration Release
      - name: Publicar o programa
        run: dotnet publish src/Debloat.App/Debloat.App.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v5
        with:
          name: DEBLOAT
          path: publish/DEBLOAT.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/DEBLOAT.exe --title "DEBLOAT! ${{ github.ref_name }}" --notes-file docs/release-notes.md
